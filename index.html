<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vietnam Huey - Вертолётный симулятор</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        overflow: hidden;
        background: #000;
        font-family: 'Courier New', monospace;
      }
      
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      
      #fps-counter {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #0f0;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px 10px;
        font-size: 14px;
        z-index: 1000;
        pointer-events: none;
      }
      
      #debug-info {
        position: fixed;
        top: 10px;
        right: 10px;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        text-align: right;
      }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        min-width: 210px;
        padding: 12px 14px;
        color: #d8f3d4;
        background: rgba(10, 24, 18, 0.78);
        border-left: 3px solid #b7d957;
        font-size: 13px;
        line-height: 1.7;
        letter-spacing: 0.04em;
        z-index: 1000;
        pointer-events: none;
      }

      #hud span {
        color: #fff6b0;
        float: right;
        margin-left: 24px;
      }

      #pause-menu.hidden {
        display: none;
      }

      #pause-menu {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(5, 12, 10, 0.72);
        color: #f5f1c5;
        z-index: 5000;
      }

      #pause-menu section {
        min-width: 260px;
        padding: 24px;
        border: 1px solid #b7d957;
        background: #14231d;
        text-align: center;
      }

      #pause-menu button {
        margin-top: 18px;
        padding: 8px 18px;
        color: #14231d;
        background: #b7d957;
        border: 0;
        cursor: pointer;
      }
      
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
        color: #0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      
      #loading.hidden {
        display: none;
      }
      
      .loading-text {
        margin-top: 20px;
        font-size: 18px;
      }
      
      .loading-bar {
        width: 300px;
        height: 4px;
        background: #333;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
      }
      
      .loading-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: #0f0;
        animation: loading 2s ease-in-out infinite;
      }
      
      @keyframes loading {
        0% { width: 0%; }
        50% { width: 100%; }
        100% { width: 0%; }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>VIETNAM HUEY</h1>
      <div class="loading-text">Загрузка...</div>
      <div class="loading-bar"></div>
    </div>
    
    <div id="fps-counter">FPS: 0</div>
    
    <div id="debug-info">
      <div>Physics: <span id="physics-status">OFF</span></div>
      <div>Terrain: <span id="terrain-status">OFF</span></div>
      <div>Chunks: <span id="chunks-count">0</span></div>
      <div>Ammo: <span id="ammo-count">500</span></div>
    </div>

    <div id="hud" data-position="3">
      <div>POSITION <span data-hud="position">EXTERNAL</span></div>
      <div>ALTITUDE <span data-hud="altitude">--</span></div>
      <div>SPEED <span data-hud="speed">--</span></div>
      <div>HULL <span data-hud="health">--</span></div>
      <div>AMMO <span data-hud="ammo">500</span></div>
    </div>

    <div id="pause-menu" class="hidden">
      <section>
        <h2>PAUSED</h2>
        <button type="button" data-action="resume">RESUME</button>
      </section>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
